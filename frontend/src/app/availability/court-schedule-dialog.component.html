<div class="backdrop" (click)="onBackdrop($event)">
  <section class="schedule-card" role="dialog" aria-modal="true" aria-labelledby="schedule-dialog-title">
    <header class="schedule-head">
      <div>
        <h2 id="schedule-dialog-title">Administrar horarios</h2>
        <p>{{ courtName }}</p>
      </div>
      <button class="close-button" type="button" aria-label="Cerrar" (click)="close.emit()">×</button>
    </header>
    <div class="schedule-body">
      @if (loading()) {
        <p class="schedule-status" role="status">Cargando horarios.</p>
      } @else if (loadError()) {
        <p class="schedule-error" role="alert">{{ loadError() }}</p>
      } @else {
        <app-weekly-schedule-form [editorOpen]="true" [rules]="formRules()" (rulesChange)="saveRules($event)" />
      }
    </div>
    <footer class="schedule-foot">
      <p class="schedule-feedback" role="status" aria-live="polite">{{ saving() ? 'Guardando…' : feedback() }}</p>
      <button class="done-button" type="button" (click)="close.emit()">Listo</button>
    </footer>
  </section>
</div>
