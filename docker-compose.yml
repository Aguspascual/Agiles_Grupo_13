services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?Configure POSTGRES_USER}:${POSTGRES_PASSWORD:?Run scripts/setup-local.ps1}@db:5432/${POSTGRES_DB:?Configure POSTGRES_DB}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?Run scripts/setup-local.ps1}"
      PORT: "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Configure POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Configure POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run scripts/setup-local.ps1}"
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
