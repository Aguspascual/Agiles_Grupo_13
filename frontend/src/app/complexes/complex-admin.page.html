<main class="admin-shell">
  <app-complex-admin-sidebar
    [showRoleSimulation]="true"
    [role]="role()"
    [managers]="managers"
    [managerId]="managerId()"
    (roleChange)="role.set($event)"
    (managerChange)="managerId.set($event)"
  />

  <section class="workspace">
    <header class="topbar">
      <h1>Complejos</h1>
      <button class="primary-button new-complex-button" type="button" [disabled]="role() !== 'admin'" (click)="openCreate()">
        <span aria-hidden="true">＋</span> Nuevo complejo
      </button>
    </header>

    @if (complexes().length) {
      <section class="complex-grid" aria-label="Complejos"><h2 class="visually-hidden">Complejos disponibles</h2>
        @for (complex of complexes(); track complex.id) {
          <app-complex-card [complex]="complex" [managers]="managers" [canManage]="true" (edit)="openEdit($event)" (remove)="deleteTarget.set($event)" />
        }
      </section>
    } @else { <section class="empty-state"><span aria-hidden="true">⌂</span><h2>No hay complejos asignados</h2><p>Esta persona no tiene complejos asignados en la vista de prueba.</p></section> }

  </section>

  @if (formOpen()) { <app-complex-form-dialog [complex]="editing()" [managers]="managers" [closing]="formClosing()" (save)="save($event)" (close)="closeForm()" (closed)="finishFormClose()" /> }

  @if (deleteTarget(); as target) {
    <app-confirm-dialog [title]="'¿Dar de baja ' + target.name + '?'" confirmLabel="Confirmar baja" (cancel)="deleteTarget.set(null)" (confirm)="confirmDelete()" />
  }
</main>
<app-toast [message]="toastMessage()" (dismiss)="toastMessage.set('')" />
