<aside class="sidebar">
  <a class="brand" routerLink="/ingresar" aria-label="PádelMatch, volver al ingreso"
    ><img src="/images/padelmatch-logo.jpg" alt="" width="44" height="44" /><span
      ><strong>PádelMatch</strong><small>Administración</small></span
    ></a
  >
  <span class="nav-label">GESTIÓN</span>
  <a
    class="nav-item"
    routerLink="/admin/complejos"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    ><span aria-hidden="true">⌂</span> Complejos</a
  >
  <a
    class="nav-item courts-nav"
    routerLink="/admin/canchas"
    [class.active]="isCourtsRoute()"
    ><span aria-hidden="true">▦</span> Canchas</a
  >
  @if (complexId) {
    <a
      class="nav-item agenda-nav"
      [routerLink]="['/admin/complejos', complexId, 'agenda']"
      routerLinkActive="active"
      ><span aria-hidden="true">▤</span> Agenda</a
    >
  }  <div class="sidebar-footer">
    <button class="logout-link" type="button" (click)="logoutOpen.set(true)">
      <span aria-hidden="true">↪</span> Cerrar sesión
    </button>
  </div>
</aside>
@if (logoutOpen()) {
  <app-confirm-dialog title="¿Cerrar sesión?" message="Vas a salir del panel de administración. Para volver a entrar tendrás que iniciar sesión nuevamente." confirmLabel="Cerrar sesión" cancelLabel="Cancelar" (cancel)="logoutOpen.set(false)" (confirm)="logout()" />
}
