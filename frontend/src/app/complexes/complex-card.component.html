<button class="complex-card" type="button" [attr.aria-label]="'Ver datos de ' + complex.name" (click)="open.emit(complex)">
  <span class="card-media">
    @if (complex.imageDataUrl) {
      <img [src]="complex.imageDataUrl" [alt]="'Imagen de ' + complex.name" />
    } @else {
      <span class="court-mark" aria-hidden="true">⌂</span>
    }
  </span>
  <span class="card-name"><span class="card-title">{{ complex.name }}</span><span class="card-arrow" aria-hidden="true">→</span></span>
</button>
